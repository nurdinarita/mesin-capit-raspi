<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesin Capit Raspberry Pi</title>
    <!-- Menghubungkan CSS statis Flask -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header-info">
        <h1 id="title-text">PILIH JUMLAH MAIN</h1>
        <div id="credit-badge" class="credits-badge hidden">
          Sisa Main: <span id="credit-count">0</span>x
        </div>
      </div>

      <!-- TAMPILAN 1: Pilihan Angka -->
      <!-- TAMPILAN 1: Pilihan Angka & Tombol Mulai -->
      <div
        id="screen-select"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
        "
      >
        <div class="grid-container">
          <div class="box-btn" onclick="highlightCredit(1, this)">
            1 <span>1x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(2, this)">
            2 <span>2x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(3, this)">
            3 <span>3x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(4, this)">
            4 <span>4x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(5, this)">
            5 <span>5x Main</span>
          </div>
        </div>

        <!-- Tombol Mulai Main -->
        <button
          id="btn-start-game"
          class="btn-start hidden"
          onclick="confirmAndStart()"
        >
          MULAI MAIN
        </button>
      </div>

      <!-- TAMPILAN 2: Menu Kontrol Mesin Capit -->
      <div id="screen-game" class="game-controls hidden">
        <div class="dpad-container">
          <button class="btn-arrow btn-up" onclick="sendAction('UP')">▲</button>
          <button class="btn-arrow btn-left" onclick="sendAction('LEFT')">
            ◄
          </button>
          <button class="btn-arrow btn-right" onclick="sendAction('RIGHT')">
            ►
          </button>
          <button class="btn-arrow btn-down" onclick="sendAction('DOWN')">
            ▼
          </button>
        </div>

        <div class="action-container">
          <button class="btn-capit" onclick="grabAction()">CAPIT!</button>
        </div>
      </div>
    </div>

    <script>
      // Generator ID Sesi Unik untuk Browser ini
      const sessionId = "session-" + Math.random().toString(36).substring(2, 9);
      let remainingCredits = 0;
      let isMyTurn = false;

      // Cek Status Mesin secara Berkala (Polling setiap 2 detik)
      setInterval(checkMachineStatus, 2000);
      checkMachineStatus();

      function checkMachineStatus() {
        if (isMyTurn) return; // Jika sedang main, abaikan pengecekan

        fetch("/check-status")
          .then((res) => res.json())
          .then((data) => {
            const title = document.getElementById("title-text");
            const selectScreen = document.getElementById("screen-select");

            if (data.is_busy) {
              title.innerText = "MESIN SEDANG DIGUNAKAN...";
              title.style.color = "#ff4d4d";
              selectScreen.style.pointerEvents = "none"; // Matikan klik tombol angka
              selectScreen.style.opacity = "0.4";
            } else {
              title.innerText = "PILIH JUMLAH MAIN";
              title.style.color = "#00f2fe";
              selectScreen.style.pointerEvents = "auto"; // Aktifkan kembali klik
              selectScreen.style.opacity = "1";
            }
          })
          .catch((err) => console.error(err));
      }

      function selectCredit(count) {
        fetch("/trigger-coin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ count: count, session_id: sessionId }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              isMyTurn = true;
              remainingCredits = count;
              document.getElementById("credit-count").innerText =
                remainingCredits;

              document.getElementById("screen-select").classList.add("hidden");
              document.getElementById("screen-game").classList.remove("hidden");
              document
                .getElementById("credit-badge")
                .classList.remove("hidden");
              document.getElementById("title-text").innerText =
                "KONTROL MESIN CAPIT";
              document.getElementById("title-text").style.color = "#00f2fe";
            } else {
              alert(data.message);
              checkMachineStatus();
            }
          })
          .catch((err) => console.error(err));
      }

      function setPinState(direction, state) {
        if (!isMyTurn) return;

        fetch("/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: direction,
            state: state,
            session_id: sessionId,
          }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "error") {
              alert(data.message);
              resetGame();
            }
          })
          .catch((err) => console.error(err));
      }

      document.querySelectorAll(".btn-arrow").forEach((btn) => {
        let action = "";
        if (btn.classList.contains("btn-up")) action = "UP";
        if (btn.classList.contains("btn-down")) action = "DOWN";
        if (btn.classList.contains("btn-left")) action = "LEFT";
        if (btn.classList.contains("btn-right")) action = "RIGHT";

        btn.addEventListener("mousedown", () => setPinState(action, "ON"));
        btn.addEventListener("touchstart", (e) => {
          e.preventDefault();
          setPinState(action, "ON");
        });

        btn.addEventListener("mouseup", () => setPinState(action, "OFF"));
        btn.addEventListener("mouseleave", () => setPinState(action, "OFF"));
        btn.addEventListener("touchend", (e) => {
          e.preventDefault();
          setPinState(action, "OFF");
        });
      });

      function grabAction() {
        if (!isMyTurn) return;

        setPinState("GRAB", "ON");
        setTimeout(() => setPinState("GRAB", "OFF"), 500);

        remainingCredits--;
        document.getElementById("credit-count").innerText = remainingCredits;

        if (remainingCredits <= 0) {
          setTimeout(() => {
            alert("Game Selesai! Kesempatan main telah habis.");
            resetGame();
          }, 600);
        }
      }

      function resetGame() {
        // Lepas sesi di server agar orang lain bisa pakai
        fetch("/release-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId }),
        });

        isMyTurn = false;
        remainingCredits = 0;
        document.getElementById("screen-select").classList.remove("hidden");
        document.getElementById("screen-game").classList.add("hidden");
        document.getElementById("credit-badge").classList.add("hidden");

        checkMachineStatus();
      }
    </script>
  </body>
</html>
