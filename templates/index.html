<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesin Capit Raspberry Pi</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header-info">
        <h1 id="title-text">PILIH JUMLAH MAIN</h1>
        <div id="credit-badge" class="credits-badge hidden">
          Sisa Main: <span id="credit-count">0</span>x
        </div>
      </div>

      <!-- TAMPILAN 1: Pilihan Angka & Tombol Mulai -->
      <div
        id="screen-select"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
        "
      >
        <div class="grid-container">
          <div class="box-btn" onclick="highlightCredit(1, this)">
            1 <span>1x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(2, this)">
            2 <span>2x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(3, this)">
            3 <span>3x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(4, this)">
            4 <span>4x Main</span>
          </div>
          <div class="box-btn" onclick="highlightCredit(5, this)">
            5 <span>5x Main</span>
          </div>
        </div>

        <button
          id="btn-start-game"
          class="btn-start"
          onclick="confirmAndStart()"
          disabled
        >
          MULAI MAIN
        </button>
      </div>

      <!-- TAMPILAN 2: Menu Kontrol Mesin Capit dengan Analog Joystick -->
      <div id="screen-game" class="game-controls hidden">
        <!-- Analog Joystick Component -->
        <div class="joystick-wrapper">
          <div class="joystick-base" id="joyBase">
            <div class="joystick-stick" id="joyStick"></div>
          </div>
        </div>

        <!-- Tombol Capit -->
        <div class="action-container">
          <button class="btn-capit" onclick="grabAction()">CAPIT!</button>
        </div>
      </div>
    </div>

    <script>
      const sessionId = "session-" + Math.random().toString(36).substring(2, 9);
      let selectedCount = 0;
      let remainingCredits = 0;
      let isMyTurn = false;
      let activeDirection = null;

      // Pengecekan Status Mesin (Polling)
      setInterval(checkMachineStatus, 2000);
      checkMachineStatus();

      function checkMachineStatus() {
        if (isMyTurn) return;

        fetch("/check-status")
          .then((res) => res.json())
          .then((data) => {
            const title = document.getElementById("title-text");
            const selectScreen = document.getElementById("screen-select");

            if (data.is_busy) {
              title.innerText = "MESIN SEDANG DIGUNAKAN...";
              title.style.color = "#ff4d4d";
              selectScreen.style.pointerEvents = "none";
              selectScreen.style.opacity = "0.4";
            } else {
              title.innerText = "PILIH JUMLAH MAIN";
              title.style.color = "#00f2fe";
              selectScreen.style.pointerEvents = "auto";
              selectScreen.style.opacity = "1";
            }
          })
          .catch((err) => console.error(err));
      }

      function highlightCredit(count, element) {
        selectedCount = count;
        document
          .querySelectorAll(".box-btn")
          .forEach((btn) => btn.classList.remove("selected"));
        element.classList.add("selected");

        const startBtn = document.getElementById("btn-start-game");
        startBtn.disabled = false;
      }

      function confirmAndStart() {
        if (selectedCount === 0) return;

        fetch("/trigger-coin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ count: selectedCount, session_id: sessionId }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              isMyTurn = true;
              remainingCredits = selectedCount;
              document.getElementById("credit-count").innerText =
                remainingCredits;

              document.getElementById("screen-select").classList.add("hidden");
              document.getElementById("screen-game").classList.remove("hidden");
              document
                .getElementById("credit-badge")
                .classList.remove("hidden");
              document.getElementById("title-text").innerText =
                "KONTROL MESIN CAPIT";
              document.getElementById("title-text").style.color = "#00f2fe";
            } else {
              alert(data.message);
              checkMachineStatus();
            }
          })
          .catch((err) => console.error(err));
      }

      function setPinState(direction, state) {
        if (!isMyTurn) return;

        fetch("/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: direction,
            state: state,
            session_id: sessionId,
          }),
        }).catch((err) => console.error(err));
      }

      /* --- LOGIKA ANALOG JOYSTICK VIRTUAL --- */
      const joyBase = document.getElementById("joyBase");
      const joyStick = document.getElementById("joyStick");
      let isDragging = false;

      function handleJoystickMove(clientX, clientY) {
        if (!isDragging || !isMyTurn) return;

        const rect = joyBase.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let deltaX = clientX - centerX;
        let deltaY = clientY - centerY;

        const maxDistance = rect.width / 2 - 20;
        const distance = Math.hypot(deltaX, deltaY);

        if (distance > maxDistance) {
          deltaX = (deltaX / distance) * maxDistance;
          deltaY = (deltaY / distance) * maxDistance;
        }

        joyStick.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

        // Threshold gerakan minimal
        if (distance < 25) {
          if (activeDirection) {
            setPinState(activeDirection, "OFF");
            activeDirection = null;
          }
          return;
        }

        // Hitung Sudut Gerakan (Sistem Arah 4 Sisi)
        const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);
        let newDirection = null;

        if (angle >= -45 && angle < 45) newDirection = "RIGHT";
        else if (angle >= 45 && angle < 135) newDirection = "DOWN";
        else if (angle >= -135 && angle < -45) newDirection = "UP";
        else newDirection = "LEFT";

        if (newDirection !== activeDirection) {
          if (activeDirection) setPinState(activeDirection, "OFF");
          setPinState(newDirection, "ON");
          activeDirection = newDirection;
        }
      }

      function resetJoystick() {
        if (!isDragging) return;
        isDragging = false;
        joyStick.style.transform = `translate(0px, 0px)`;

        if (activeDirection) {
          setPinState(activeDirection, "OFF");
          activeDirection = null;
        }
      }

      // Event Listener Mouse
      joyBase.addEventListener("mousedown", (e) => {
        isDragging = true;
        handleJoystickMove(e.clientX, e.clientY);
      });
      window.addEventListener("mousemove", (e) =>
        handleJoystickMove(e.clientX, e.clientY),
      );
      window.addEventListener("mouseup", resetJoystick);

      // Event Listener Touch (Smartphone / Touchscreen)
      joyBase.addEventListener("touchstart", (e) => {
        isDragging = true;
        handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener("touchmove", (e) => {
        if (isDragging)
          handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener("touchend", resetJoystick);

      /* --- AKSI CAPIT --- */
      function grabAction() {
        if (!isMyTurn) return;

        setPinState("GRAB", "ON");
        setTimeout(() => setPinState("GRAB", "OFF"), 500);

        remainingCredits--;
        document.getElementById("credit-count").innerText = remainingCredits;

        if (remainingCredits <= 0) {
          setTimeout(() => {
            alert("Game Selesai! Kesempatan main telah habis.");
            resetGame();
          }, 600);
        }
      }

      function resetGame() {
        fetch("/release-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId }),
        });

        isMyTurn = false;
        selectedCount = 0;
        remainingCredits = 0;

        document
          .querySelectorAll(".box-btn")
          .forEach((btn) => btn.classList.remove("selected"));

        const startBtn = document.getElementById("btn-start-game");
        startBtn.disabled = true;

        document.getElementById("screen-select").classList.remove("hidden");
        document.getElementById("screen-game").classList.add("hidden");
        document.getElementById("credit-badge").classList.add("hidden");

        checkMachineStatus();
      }
    </script>
  </body>
</html>
