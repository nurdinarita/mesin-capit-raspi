<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesin Capit Raspberry Pi</title>
    <!-- Menghubungkan CSS statis Flask -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='assets/css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="header-info">
        <h1 id="title-text">PILIH JUMLAH MAIN</h1>
        <div id="credit-badge" class="credits-badge hidden">
          Sisa Main: <span id="credit-count">0</span>x
        </div>
      </div>

      <!-- TAMPILAN 1: Pilihan Angka -->
      <div id="screen-select" class="grid-container">
        <div class="box-btn" onclick="selectCredit(1)">
          1 <span>1x Main</span>
        </div>
        <div class="box-btn" onclick="selectCredit(2)">
          2 <span>2x Main</span>
        </div>
        <div class="box-btn" onclick="selectCredit(3)">
          3 <span>3x Main</span>
        </div>
        <div class="box-btn" onclick="selectCredit(4)">
          4 <span>4x Main</span>
        </div>
        <div class="box-btn" onclick="selectCredit(5)">
          5 <span>5x Main</span>
        </div>
      </div>

      <!-- TAMPILAN 2: Menu Kontrol Mesin Capit -->
      <div id="screen-game" class="game-controls hidden">
        <div class="dpad-container">
          <button class="btn-arrow btn-up" onclick="sendAction('UP')">▲</button>
          <button class="btn-arrow btn-left" onclick="sendAction('LEFT')">
            ◄
          </button>
          <button class="btn-arrow btn-right" onclick="sendAction('RIGHT')">
            ►
          </button>
          <button class="btn-arrow btn-down" onclick="sendAction('DOWN')">
            ▼
          </button>
        </div>

        <div class="action-container">
          <button class="btn-capit" onclick="grabAction()">CAPIT!</button>
        </div>
      </div>
    </div>

    <script>
      let remainingCredits = 0;

      // Trigger Koin saat Angka 1, 2, 3, 4, 5 diklik
      function selectCredit(count) {
        remainingCredits = count;
        document.getElementById("credit-count").innerText = remainingCredits;

        // Kirim request pulsa HIGH-LOW jeda 1 detik sebanyak N kali
        fetch("/trigger-coin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ count: count }),
        });

        document.getElementById("screen-select").classList.add("hidden");
        document.getElementById("screen-game").classList.remove("hidden");
        document.getElementById("credit-badge").classList.remove("hidden");
        document.getElementById("title-text").innerText = "KONTROL MESIN CAPIT";
      }

      // Fungsi Kirim Status Tahan (ON) atau Lepas (OFF)
      function setPinState(direction, state) {
        fetch("/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: direction, state: state }),
        }).catch((err) => console.error(err));
      }

      // Pasang Event Listener Tahan/Lepas pada Tombol Navigasi
      document.querySelectorAll(".btn-arrow").forEach((btn) => {
        let action = "";
        if (btn.classList.contains("btn-up")) action = "UP";
        if (btn.classList.contains("btn-down")) action = "DOWN";
        if (btn.classList.contains("btn-left")) action = "LEFT";
        if (btn.classList.contains("btn-right")) action = "RIGHT";

        // Tekan (Mouse / Sentuhan) -> HIGH
        btn.addEventListener("mousedown", () => setPinState(action, "ON"));
        btn.addEventListener("touchstart", (e) => {
          e.preventDefault();
          setPinState(action, "ON");
        });

        // Lepas (Mouse / Sentuhan) -> LOW
        btn.addEventListener("mouseup", () => setPinState(action, "OFF"));
        btn.addEventListener("mouseleave", () => setPinState(action, "OFF"));
        btn.addEventListener("touchend", (e) => {
          e.preventDefault();
          setPinState(action, "OFF");
        });
      });

      // Aksi Tombol Capit (Sekali Klik Beri Pulsa HIGH)
      function grabAction() {
        setPinState("GRAB", "ON");
        setTimeout(() => setPinState("GRAB", "OFF"), 500);

        remainingCredits--;
        document.getElementById("credit-count").innerText = remainingCredits;

        if (remainingCredits <= 0) {
          setTimeout(() => {
            alert("Game Selesai! Kesempatan main telah habis.");
            resetGame();
          }, 600);
        }
      }

      function resetGame() {
        remainingCredits = 0;
        document.getElementById("screen-select").classList.remove("hidden");
        document.getElementById("screen-game").classList.add("hidden");
        document.getElementById("credit-badge").classList.add("hidden");
        document.getElementById("title-text").innerText = "PILIH JUMLAH MAIN";
      }
    </script>
  </body>
</html>
